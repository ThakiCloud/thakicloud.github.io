# (DORMANT) github.io를 thakicloud.com/tech-blog로 보내는 301-유사 리디렉션 스텁 배포.
# ⚠️ 수동 발동 전용(workflow_dispatch). CloudFront Function(디렉토리→index.html) 수정이
#    확인된 뒤에만 실행한다. 그 전에 켜면 라이브 링크가 메인 폴백으로 깨진다.
name: (dormant) GitHub Pages redirect to tech-blog
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build redirect stubs (redirect_mode)
        run: bundle exec jekyll build --config _config.yml,_config-redirect.yml
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v4
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
