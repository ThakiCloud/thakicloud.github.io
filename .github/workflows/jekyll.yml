name: Build Jekyll and Deploy to S3 (/tech-blog)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC로 AWS 역할 assume

concurrency:
  group: "tech-blog-s3-deploy"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      S3_BUCKET: thakicloud-portal-com
      CF_DISTRIBUTION_ID: E1RQ006X2589V5   # thakicloud.com 서빙 배포(무효화 대상)
      AWS_REGION: ap-northeast-2
      DEST_PREFIX: tech-blog
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      
      - name: 📊 Filter posts by category (limit large categories)
        run: |
          echo "=== Filtering posts to reduce build size ==="
          
          # 빌드 크기 백스톱. 실제 게이트는 front-matter published:false
          # (tech-blog-manager의 250/lang cap). 여기선 파일 수만 넉넉히 제한.
          # KEEP_COUNT는 카테고리별 published 상한보다 커야 한다. research는 no-drop
          # (cap None)이라 300/lang 백스톱까지 자랄 수 있으므로 그보다 넉넉히 크게 둔다.
          # 이 필터는 날짜순 파일 수만 제한한다(published 플래그 무시) — 너무 낮으면 오래된
          # published 글이 빌드에서 누락돼 404가 된다(2026-08-03 tokenizer 사고).
          LIMIT_CATEGORIES=("agentops" "tutorials" "dev" "owm" "research" "llmops")
          KEEP_COUNT=500
          
          for lang in ko en; do
            for category in "${LIMIT_CATEGORIES[@]}"; do
              dir="_posts/$lang/$category"
              if [ -d "$dir" ]; then
                # 해당 카테고리의 포스트 개수 확인
                post_count=$(find "$dir" -maxdepth 1 -name "*.md" -type f | wc -l)
                echo "[$lang/$category] Found $post_count posts"
                
                if [ "$post_count" -gt "$KEEP_COUNT" ]; then
                  # 백업 디렉토리 생성
                  mkdir -p "_posts_backup/$lang/$category"
                  
                  # 파일을 날짜순으로 정렬 (파일명 기준, 최신순)
                  # 최신 15개를 제외한 나머지를 백업으로 이동
                  find "$dir" -maxdepth 1 -name "*.md" -type f | sort -r | tail -n +$((KEEP_COUNT + 1)) > /tmp/files_to_move.txt
                  
                  # 파일 이동
                  while IFS= read -r file; do
                    mv "$file" "_posts_backup/$lang/$category/" || echo "Warning: failed to move $file"
                  done < /tmp/files_to_move.txt
                  
                  # 결과 확인
                  remaining=$(find "$dir" -maxdepth 1 -name "*.md" -type f | wc -l)
                  moved=$((post_count - remaining))
                  echo "[$lang/$category] Kept $remaining posts, moved $moved posts to backup"
                fi
              fi
            done
          done
          
          echo ""
          echo "=== Filtering Summary ==="
          total_backup=$(find _posts_backup -name "*.md" -type f 2>/dev/null | wc -l)
          echo "Total posts moved to backup: $total_backup"
          echo "Remaining posts will be built"
          
          # 최종 통계
          echo ""
          echo "=== Final post count by category ==="
          for lang in ko en; do
            echo "Language: $lang"
            for cat_dir in _posts/$lang/*/; do
              if [ -d "$cat_dir" ]; then
                category=$(basename "$cat_dir")
                count=$(find "$cat_dir" -maxdepth 1 -name "*.md" -type f | wc -l)
                if [ "$count" -gt 0 ]; then
                  echo "  - $category: $count posts"
                fi
              fi
            done
          done

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 0

      - name: Fix baseurl-aware asset paths (prevent broken images on subpath)
        run: |
          # Auto-generated posts (news-comic, nightly-paper, tech-blog-manager)
          # emit root-absolute ](/assets/..) which breaks under the /tech-blog
          # baseurl. Rewrite body refs to relative_url. Idempotent.
          python3 scripts/fix_asset_baseurl.py --apply

      - name: Strip references to missing images (prevent broken <img>)
        run: |
          # If a generator emitted a hero/figure reference but failed to produce
          # the file, drop the dangling reference so no broken image ships.
          # Logs exactly what was stripped; deploy stays resilient (one missing
          # image never blocks the whole site).
          python3 scripts/check_missing_assets.py --strip

      - name: Enforce KO brand/typo guardrail (다키클라우드)
        run: |
          # Deterministic guardrail: never ship the wrong brand name. Corrects
          # 타키클라우드 / 타키 클라우드 -> 다키클라우드 plus a small curated KO typo map.
          # Fixes prose/titles/front-matter; protects code blocks and URLs.
          # Every deploy runs this, so no post can ship with the wrong brand.
          python3 scripts/blog_fix_typos.py --apply

      - name: Build with Jekyll (baseurl=/tech-blog from _config)
        run: |
          bundle exec jekyll build --trace
          test -f _site/index.html || { echo "❌ _site/index.html 없음 — 빌드 실패"; exit 1; }
          grep -q 'href="/tech-blog/' _site/index.html || { echo "❌ /tech-blog 접두어 미적용"; exit 1; }
        env:
          JEKYLL_ENV: production

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync _site/ to S3 /tech-blog/
        run: |
          aws s3 sync _site/ "s3://${S3_BUCKET}/${DEST_PREFIX}/" \
            --delete \
            --cache-control "public,max-age=3600"

      - name: Invalidate CloudFront /tech-blog/*
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DISTRIBUTION_ID}" \
            --paths "/${DEST_PREFIX}/*"
