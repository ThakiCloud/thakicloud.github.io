name: Build Jekyll and Deploy to S3 (/tech-blog)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC로 AWS 역할 assume

concurrency:
  group: "tech-blog-s3-deploy"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      S3_BUCKET: thakicloud-portal-com
      CF_DISTRIBUTION_ID: E1RQ006X2589V5   # thakicloud.com 서빙 배포(무효화 대상)
      AWS_REGION: ap-northeast-2
      DEST_PREFIX: tech-blog
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ⛔ 배포 게이트: 이미 게시된 URL 은 약속이다 (2026-08-22 사고).
      # 나이틀리 publish 패스가 STALE 정책 코드로 돌아 published:false 를 554개에
      # 한꺼번에 박았고, 링크드인에 뿌린 링크가 전부 죽었다. 같은 버그를 8-12 에
      # 이미 한 번 고쳤는데 재발했다 — 규칙이 "어느 머신이든 옛 사본을 돌릴 수 있는"
      # 플래너 로직에만 있었기 때문이다. 그래서 판정을 CI(=stale 될 수 없는 곳)로 옮긴다.
      # fail-closed: 살아 있던 URL 이 사라지면 배포를 막고 기존 사이트를 그대로 둔다.
      - name: ⛔ URL ratchet (block silent unpublish of live URLs)
        run: python3 scripts/url_ratchet.py --check

      # ⛔ 내부 링크는 baseurl 을 달아야 하고 실재하는 글을 가리켜야 한다.
      # Jekyll 은 `](/ko/...)` 같은 루트상대 링크에 baseurl 을 주입하지 않아서
      # thakicloud.com/ko/... 로 나가고, CloudFront 가 랜딩페이지를 200 으로 돌려준다.
      # 상태코드로는 절대 안 잡히는 soft-404 다 (2026-08-27, autosaddler 글).
      - name: ⛔ Internal link check (baseurl + target exists)
        run: python3 scripts/internal_link_check.py

      
      - name: 📊 Filter posts by category (limit large categories)
        run: |
          echo "=== Filtering unpublished posts to reduce build size ==="

          # 실제 게시 게이트 = front-matter published:false (tech-blog-manager 소유).
          # 이 단계는 그 published:false 글만 빌드에서 제외해 빌드를 가볍게 한다.
          # ⛔ 날짜순 KEEP_COUNT로 자르지 말 것 — published 글이 누락돼 soft-404가 된다
          #    (2026-08-03 tokenizer 사고). published 글은 카테고리·나이와 무관하게 항상 빌드.
          # ⛔ `draft: true` 와 `dry-` 슬러그도 같은 게이트에서 걸러낸다.
          #    url_ratchet.published_urls() 는 오래전부터 이 둘을 원장에서 빼 왔지만
          #    빌드는 그대로 태우고 있었다 — 주석만 "mirrors the build gate" 였고
          #    빌드 게이트가 실제로는 없었다. 그래서 만화 드라이런이 2026-08-22 와
          #    2026-08-25 두 번 라이브로 나갔다(/ko/comics/dry-twitter/).
          moved=0
          kept=0
          drafts=0
          while IFS= read -r file; do
            base=$(basename "$file")
            if grep -qiE '^draft:[[:space:]]*(true|yes|1)[[:space:]]*$' "$file" \
               || [[ "$base" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-dry- ]]; then
              rel="${file#_posts/}"
              mkdir -p "_posts_backup/$(dirname "$rel")"
              mv "$file" "_posts_backup/$rel" && drafts=$((drafts + 1))
              echo "  draft-veto: $rel"
            elif grep -qiE '^published:[[:space:]]*(false|no|0)[[:space:]]*$' "$file"; then
              rel="${file#_posts/}"
              mkdir -p "_posts_backup/$(dirname "$rel")"
              if mv "$file" "_posts_backup/$rel"; then
                moved=$((moved + 1))
              else
                echo "Warning: failed to move $file"
              fi
            else
              kept=$((kept + 1))
            fi
          done < <(find _posts/ko _posts/en -name "*.md" -type f)   # ar은 _config exclude로 미빌드

          echo ""
          echo "=== Filtering Summary ==="
          echo "Unpublished moved to backup: $moved"
          echo "Draft/dry-run vetoed:        $drafts"
          echo "Published kept for build:    $kept"

          # 최종 통계
          echo ""
          echo "=== Published post count by category ==="
          for lang in ko en; do
            echo "Language: $lang"
            for cat_dir in _posts/$lang/*/; do
              if [ -d "$cat_dir" ]; then
                category=$(basename "$cat_dir")
                count=$(find "$cat_dir" -maxdepth 1 -name "*.md" -type f | wc -l)
                if [ "$count" -gt 0 ]; then
                  echo "  - $category: $count posts"
                fi
              fi
            done
          done

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 0

      - name: Fix baseurl-aware asset paths (prevent broken images on subpath)
        run: |
          # Auto-generated posts (news-comic, nightly-paper, tech-blog-manager)
          # emit root-absolute ](/assets/..) which breaks under the /tech-blog
          # baseurl. Rewrite body refs to relative_url. Idempotent.
          python3 scripts/fix_asset_baseurl.py --apply

      - name: Strip references to missing images (prevent broken <img>)
        run: |
          # If a generator emitted a hero/figure reference but failed to produce
          # the file, drop the dangling reference so no broken image ships.
          # Logs exactly what was stripped; deploy stays resilient (one missing
          # image never blocks the whole site).
          python3 scripts/check_missing_assets.py --strip

      - name: Enforce KO brand/typo guardrail (다키클라우드)
        run: |
          # Deterministic guardrail: never ship the wrong brand name. Corrects
          # 타키클라우드 / 타키 클라우드 -> 다키클라우드 plus a small curated KO typo map.
          # Fixes prose/titles/front-matter; protects code blocks and URLs.
          # Every deploy runs this, so no post can ship with the wrong brand.
          python3 scripts/blog_fix_typos.py --apply

      - name: Build with Jekyll (baseurl=/tech-blog from _config)
        run: |
          bundle exec jekyll build --trace
          test -f _site/index.html || { echo "❌ _site/index.html 없음 — 빌드 실패"; exit 1; }
          grep -q 'href="/tech-blog/' _site/index.html || { echo "❌ /tech-blog 접두어 미적용"; exit 1; }
        env:
          JEKYLL_ENV: production

      # 언어 토글은 경로의 언어 구간만 갈아끼운다(hreflang을 읽지 않는다). 그래서
      # 카테고리 구간이 언어마다 다르면 토글이 없는 주소로 간다 — 만화(ko)/comics(en)이
      # 정확히 그렇게 깨졌다. 배포 전에 빌드 산출물로 그 산술을 재현해 막는다.
      - name: Verify language toggle reaches every translation
        run: python3 scripts/check_language_toggle.py _site

      # ⛔ 이질 문자는 소스가 아니라 빌드 산출물에서 잡는다. 2026-08-27 유출은 _posts 가
      # 아니라 _config.yml 브랜드 메타에서 나와 모든 페이지가 아랍어 122자를 실어 날랐다.
      - name: ⛔ Script purity (no stray Arabic/Cyrillic/Kana in built pages)
        run: python3 scripts/script_purity_check.py _site

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 미디어/HTML 분리 sync (2026-08-12).
      # Jekyll이 매 빌드마다 _site로 미디어를 새로 복사해 mtime이 전부 갱신되므로,
      # 기본 sync(mtime 비교)는 안 바뀐 수 GB를 매번 재업로드했다. 미디어는 --size-only로
      # 델타만 올린다. 그리고 미디어에는 --delete를 걸지 않는다 — png→webp 전환처럼
      # 소스에서 사라진 옛 파일도 S3에는 남겨 외부에서 걸어둔 핫링크/og:image가 죽지 않게
      # 한다(글 404 사고와 같은 계열의 "링크는 약속" 원칙). HTML sync의 --delete는
      # 미디어 prefix를 제외해 미디어를 지우지 못하게 스코프한다.
      - name: Sync media to S3 (delta only, never delete)
        run: |
          aws s3 sync _site/assets/ "s3://${S3_BUCKET}/${DEST_PREFIX}/assets/" \
            --size-only \
            --exclude "css/*" --exclude "js/*" \
            --cache-control "public,max-age=604800"

      - name: Sync HTML/CSS/JS to S3 /tech-blog/ (with scoped delete)
        run: |
          aws s3 sync _site/ "s3://${S3_BUCKET}/${DEST_PREFIX}/" \
            --delete \
            --exclude "assets/*" \
            --include "assets/css/*" --include "assets/js/*" \
            --cache-control "public,max-age=3600"

      - name: Invalidate CloudFront /tech-blog/*
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DISTRIBUTION_ID}" \
            --paths "/${DEST_PREFIX}/*"

      # 내용 기반 배포 검증 (2026-08-12). 이 사이트의 CloudFront는 없는 경로에도
      # 200 + 사이트 셸을 돌려주므로(catch-all) 상태코드로는 soft-404를 못 잡는다.
      # 방금 빌드한 _site에서 포스트 3개를 뽑아 라이브 HTML에 그 글의 <title>이 실제로
      # 들어있는지 비교한다. 실패 = 빌드는 됐는데 서빙이 깨진 것 → 잡 실패로 표면화.
      # 배포 후 전수 대조: 원장의 모든 URL 이 실제 배포된 인덱스에 링크돼 있나.
      # 3장 샘플링(아래)은 "배포가 살아 있나"를 보고, 이 단계는 "약속한 URL 이 다
      # 있나"를 본다 — 2026-08-22 처럼 554개가 조용히 빠지는 사고는 샘플링으로는
      # 안 잡힌다. 이 대조가 url_ratchet 의 URL 계산기가 Jekyll 과 어긋나는 것도
      # 잡는다(2026-08-23: categories 없는 글의 경로를 잘못 계산해 원장에 실재하지
      # 않는 URL 6개가 들어갔던 건을 정확히 이 방법으로 발견했다).
      - name: Verify every promised URL is actually deployed
        run: |
          python3 - <<'EOF'
          import json, sys, time, urllib.request
          from pathlib import Path
          ledger = set(json.loads(Path("_data/published_urls.json").read_text()))
          linked = set()
          for lang in ("en", "ko"):
              url = f"https://thakicloud.com/tech-blog/{lang}/"
              html = ""
              for _ in range(6):          # CloudFront 무효화 전파 대기
                  try:
                      html = urllib.request.urlopen(url, timeout=45).read().decode("utf-8", "ignore")
                      if len(html) > 200_000:
                          break
                  except Exception as e:
                      print(f"  retry {lang}: {type(e).__name__}")
                  time.sleep(20)
              import re
              for m in re.finditer(r'href="(/tech-blog/(?:en|ko)/[^"?]*?)"', html):
                  u = m.group(1)
                  linked.add(u if u.endswith("/") else u + "/")
          missing = sorted(ledger - linked)
          print(f"ledger={len(ledger)} linked-on-deployed-index={len(linked)} missing={len(missing)}")
          for u in missing[:30]:
              print("   MISSING", u)
          if missing:
              print("\n배포된 사이트에 원장의 URL 이 없다. 게시된 URL 은 약속이다.")
              sys.exit(1)
          print("OK: every promised URL is live.")
          EOF

      - name: Verify deployed content (soft-404 guard)
        run: |
          python3 - <<'EOF'
          import random, re, sys, time, urllib.parse, urllib.request
          from pathlib import Path
          site = Path("_site")
          pages = [p for p in site.rglob("index.html")
                   if re.search(r"/(ko|en)/", str(p)) and p.parent != site]
          random.shuffle(pages)
          picked = pages[:3]
          fails = []
          for p in picked:
              m = re.search(r"<title>([^<]+)</title>", p.read_text(encoding="utf-8", errors="ignore"))
              if not m: continue
              title = m.group(1).strip()
              rel = str(p.parent.relative_to(site))
              # ⛔ 경로를 퍼센트 인코딩한다. ko 카테고리에는 한글 디렉터리(_posts/ko/만화)가
              # 있고, urlopen 은 non-ASCII URL 에 UnicodeEncodeError 를 던진다. 예전엔 그
              # 예외를 아래 except 가 삼켜서 "인코딩 못 함"이 "soft-404"로 둔갑했고,
              # 만화 글이 뽑힐 때마다 배포 잡이 잘못된 이유로 빨간불이 됐다 (2026-08-13).
              url = ("https://thakicloud.com/tech-blog/"
                     + urllib.parse.quote(rel) + "/")
              ok, why = False, "no attempt"
              # 8회 × 20초 = 최대 160초. 이전 4×15초(60초)는 CloudFront 와일드카드
              # 무효화(/tech-blog/*)가 퍼지기 전에 포기해서, 정상 배포를 soft-404 로
              # 오판하고 잡을 빨간불로 만들었다 (2026-08-13 09:21 런).
              for attempt in range(8):   # CloudFront 무효화 전파 대기
                  try:
                      html = urllib.request.urlopen(url, timeout=20).read().decode("utf-8", "ignore")
                      if title[:40] in html:
                          ok = True
                          break
                      why = "served page lacks its own <title> (catch-all shell)"
                  except Exception as e:            # 원인을 삼키지 말고 남긴다
                      why = f"{type(e).__name__}: {str(e)[:80]}"
                  time.sleep(20)
              print(("OK   " if ok else "FAIL ") + f"{url}  [{title[:60]}]"
                    + ("" if ok else f"  -> {why}"))
              if not ok: fails.append(url)
          if fails:
              print("soft-404 detected: built page not served with its own content"); sys.exit(1)
          EOF
