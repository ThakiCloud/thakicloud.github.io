<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 397.54999999999995 574.8" width="397.54999999999995" height="574.8" style="--bg:#1a1b26;--fg:#a9b1d6">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="AGENT" data-to="SPANS" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="197.6250833333333,76.9 197.6250833333333,112.9 141.37349999999998,112.9 141.37349999999998,124.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="SPANS" data-to="STORE" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="141.37349999999998,195.60000000000002 141.37349999999998,243.60000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="STORE" data-to="EVAL" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="141.37349999999998,297.40000000000003 141.37349999999998,345.40000000000003" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="EVAL" data-to="DEBUG" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="141.37349999999998,416.1 141.37349999999998,452.1 181.5700833333333,452.1 181.5700833333333,464.1" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="DEBUG" data-to="AGENT" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="feedback" points="257.55041666666665,464.1 257.55041666666665,452.1 297.74699999999996,452.1 297.74699999999996,231.60000000000002 241.49541666666664,231.60000000000002 241.49541666666664,76.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="DEBUG" data-to="AGENT" data-label="feedback">
  <rect x="266.74699999999996" y="390.8" width="61.606" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="297.54999999999995" y="405.95" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">feedback</text>
</g>
<g class="node" data-id="AGENT" data-label="Multi-agent Run" data-shape="rectangle">
  <rect x="153.75474999999997" y="40" width="131.611" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="219.56024999999997" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Multi-agent Run</text>
</g>
<g class="node" data-id="SPANS" data-label="Nested Spans
(step tree, memory/state,
cost attribution)" data-shape="rectangle">
  <rect x="50.0035" y="124.9" width="182.73999999999995" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="141.37349999999998" y="160.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="141.37349999999998" dy="-12.350000000000001">Nested Spans</tspan><tspan x="141.37349999999998" dy="16.900000000000002">(step tree, memory/state,</tspan><tspan x="141.37349999999998" dy="16.900000000000002">cost attribution)</tspan></text>
</g>
<g class="node" data-id="STORE" data-label="Trace Store
(MLflow / LangSmith / Arize)" data-shape="rectangle">
  <rect x="40" y="243.60000000000002" width="202.74699999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="141.37349999999998" y="270.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="141.37349999999998" dy="-3.9000000000000012">Trace Store</tspan><tspan x="141.37349999999998" dy="16.900000000000002">(MLflow / LangSmith / Arize)</tspan></text>
</g>
<g class="node" data-id="EVAL" data-label="Evaluation Loop
(offline vs online,
LLM-judge, metrics)" data-shape="rectangle">
  <rect x="61.85949999999997" y="345.40000000000003" width="159.02800000000002" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="141.37349999999998" y="380.75000000000006" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="141.37349999999998" dy="-12.350000000000001">Evaluation Loop</tspan><tspan x="141.37349999999998" dy="16.900000000000002">(offline vs online,</tspan><tspan x="141.37349999999998" dy="16.900000000000002">LLM-judge, metrics)</tspan></text>
</g>
<g class="node" data-id="DEBUG" data-label="Production Debugging
(replay failed traces,
context-drift, tool-error patterns)" data-shape="rectangle">
  <rect x="105.58974999999997" y="464.1" width="227.941" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="219.56024999999997" y="499.45000000000005" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="219.56024999999997" dy="-12.350000000000001">Production Debugging</tspan><tspan x="219.56024999999997" dy="16.900000000000002">(replay failed traces,</tspan><tspan x="219.56024999999997" dy="16.900000000000002">context-drift, tool-error patterns)</tspan></text>
</g>
</svg>