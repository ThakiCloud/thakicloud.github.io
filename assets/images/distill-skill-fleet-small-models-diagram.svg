<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Inter, 'Noto Sans KR', sans-serif">
  <rect width="1200" height="560" fill="#f7f9fc"/>
  <text x="600" y="46" text-anchor="middle" font-size="25" font-weight="700" fill="#1B4F72">검증된 스킬을 소형 워커로 증류하는 하이브리드 구조</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Stage 1 -->
  <g>
    <rect x="40" y="110" width="250" height="150" rx="14" fill="#e8f1fb" stroke="#1B4F72" stroke-width="2"/>
    <text x="165" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#1B4F72">1. 검증된 스킬 플릿</text>
    <text x="165" y="180" text-anchor="middle" font-size="13.5" fill="#2E4057">포맷 결정론 = 코드 소유</text>
    <text x="165" y="202" text-anchor="middle" font-size="13.5" fill="#2E4057">숫자 · enum · 렌더링</text>
    <text x="165" y="224" text-anchor="middle" font-size="13.5" fill="#2E4057">뉴스 · 트윗 · 리포트 배치</text>
  </g>

  <!-- Stage 2 -->
  <g>
    <rect x="330" y="110" width="250" height="150" rx="14" fill="#e6f6f3" stroke="#0e8a76" stroke-width="2"/>
    <text x="455" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#0e8a76">2. 스킬별 전문 교사</text>
    <text x="455" y="180" text-anchor="middle" font-size="13.5" fill="#2E4057">도메인 RL 체크포인트</text>
    <text x="455" y="202" text-anchor="middle" font-size="13.5" fill="#2E4057">크기가 아니라 전문화</text>
    <text x="455" y="224" text-anchor="middle" font-size="13.5" fill="#2E4057">같은 베이스, 한 도메인 심화</text>
  </g>

  <!-- Stage 3 -->
  <g>
    <rect x="620" y="110" width="250" height="150" rx="14" fill="#fef3e2" stroke="#c77d0a" stroke-width="2"/>
    <text x="745" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#c77d0a">3. 온폴리시 증류</text>
    <text x="745" y="180" text-anchor="middle" font-size="13.5" fill="#2E4057">학생 자기 궤적 생성</text>
    <text x="745" y="202" text-anchor="middle" font-size="13.5" fill="#2E4057">교사가 토큰 단위 채점</text>
    <text x="745" y="224" text-anchor="middle" font-size="13.5" fill="#2E4057">검증 게이트로 나쁜 신호 제거</text>
  </g>

  <!-- Stage 4 -->
  <g>
    <rect x="910" y="110" width="250" height="150" rx="14" fill="#efeafc" stroke="#5b4bc4" stroke-width="2"/>
    <text x="1035" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#5b4bc4">4. 소형 로컬 워커</text>
    <text x="1035" y="180" text-anchor="middle" font-size="13.5" fill="#2E4057">Gemma-4-26B ≈ Haiku</text>
    <text x="1035" y="202" text-anchor="middle" font-size="13.5" fill="#2E4057">워커 준수도 18 대 18</text>
    <text x="1035" y="224" text-anchor="middle" font-size="13.5" fill="#2E4057">약 1만 토큰 컨텍스트 천장</text>
  </g>

  <line x1="290" y1="185" x2="326" y2="185" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="185" x2="616" y2="185" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="870" y1="185" x2="906" y2="185" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Hybrid routing band -->
  <rect x="40" y="330" width="1120" height="120" rx="12" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#1B4F72">하이브리드 라우팅: 컨덕터는 남기고 워커만 내린다</text>

  <rect x="70" y="378" width="500" height="52" rx="10" fill="#e8f1fb" stroke="#1B4F72" stroke-width="1.5"/>
  <text x="320" y="401" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B4F72">프런티어 컨덕터</text>
  <text x="320" y="420" text-anchor="middle" font-size="12.5" fill="#2E4057">무거운 추론 · 긴 컨텍스트 · 지휘</text>

  <rect x="630" y="378" width="500" height="52" rx="10" fill="#efeafc" stroke="#5b4bc4" stroke-width="1.5"/>
  <text x="880" y="401" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5b4bc4">로컬 소형 워커</text>
  <text x="880" y="420" text-anchor="middle" font-size="12.5" fill="#2E4057">정형 · 반복 · 대량 무인 실행</text>

  <text x="600" y="495" text-anchor="middle" font-size="14" font-style="italic" fill="#5b4bc4">회고 기반 에스컬레이션: 싸게 시작하고, 반복 실패한 스킬만 상위 모델로 되돌린다</text>
  <path d="M880,430 L880,470 L320,470 L320,432" fill="none" stroke="#5b4bc4" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
</svg>
