<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7aa2f7"/>
    </marker>
    <marker id="arwGold" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#e0af68"/>
    </marker>
    <marker id="arwGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="680" fill="#1a1b26"/>

  <!-- sovereign k8s container -->
  <rect x="16" y="16" width="868" height="600" rx="16" fill="#16161e" stroke="#414868" stroke-width="1.5"/>
  <text x="40" y="46" fill="#7aa2f7" font-size="15" font-weight="700">Sovereign on-prem Kubernetes</text>
  <text x="40" y="64" fill="#565f89" font-size="11">data and trail never leave the tenant boundary</text>

  <!-- execution flow (left column) -->
  <rect x="64" y="80" width="300" height="52" rx="10" fill="#24283b" stroke="#7dcfff" stroke-width="1.5"/>
  <text x="214" y="111" fill="#c0caf5" font-size="14" font-weight="600" text-anchor="middle">Agent action / intent</text>

  <rect x="64" y="172" width="300" height="52" rx="10" fill="#24283b" stroke="#bb9af7" stroke-width="1.5"/>
  <text x="214" y="197" fill="#c0caf5" font-size="14" font-weight="600" text-anchor="middle">Policy Gate — L0 to L3 autonomy</text>
  <text x="214" y="214" fill="#9aa5ce" font-size="11" text-anchor="middle">approve or block, both recorded</text>

  <rect x="64" y="264" width="300" height="52" rx="10" fill="#24283b" stroke="#7aa2f7" stroke-width="1.5"/>
  <text x="214" y="289" fill="#c0caf5" font-size="14" font-weight="600" text-anchor="middle">Skill and Tool call</text>
  <text x="214" y="306" fill="#9aa5ce" font-size="11" text-anchor="middle">inside an isolated sandbox</text>

  <rect x="64" y="356" width="300" height="52" rx="10" fill="#24283b" stroke="#7aa2f7" stroke-width="1.5"/>
  <text x="214" y="381" fill="#c0caf5" font-size="14" font-weight="600" text-anchor="middle">MCP connector</text>
  <text x="214" y="398" fill="#9aa5ce" font-size="11" text-anchor="middle">crosses the system boundary</text>

  <rect x="64" y="448" width="300" height="52" rx="10" fill="#24283b" stroke="#9ece6a" stroke-width="1.5"/>
  <text x="214" y="479" fill="#c0caf5" font-size="14" font-weight="600" text-anchor="middle">Outcome</text>

  <!-- vertical flow arrows -->
  <line x1="214" y1="132" x2="214" y2="170" stroke="#7aa2f7" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="214" y1="224" x2="214" y2="262" stroke="#7aa2f7" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="214" y1="316" x2="214" y2="354" stroke="#7aa2f7" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="214" y1="408" x2="214" y2="446" stroke="#7aa2f7" stroke-width="2" marker-end="url(#arw)"/>

  <!-- audit log rail (right) -->
  <rect x="520" y="80" width="320" height="420" rx="12" fill="#1f2130" stroke="#e0af68" stroke-width="1.5"/>
  <text x="544" y="116" fill="#e0af68" font-size="17" font-weight="700">Audit Log</text>
  <text x="544" y="137" fill="#a9b1d6" font-size="12">first-class resource</text>
  <line x1="540" y1="152" x2="820" y2="152" stroke="#3b4261" stroke-width="1"/>
  <text x="544" y="182" fill="#c0caf5" font-size="12.5">Every step writes here as it runs.</text>
  <text x="544" y="204" fill="#c0caf5" font-size="12.5">The record grows with execution,</text>
  <text x="544" y="226" fill="#c0caf5" font-size="12.5">not bolted on afterward.</text>
  <text x="544" y="266" fill="#9aa5ce" font-size="11.5">- which skill was invoked</text>
  <text x="544" y="288" fill="#9aa5ce" font-size="11.5">- which tool, under which permission</text>
  <text x="544" y="310" fill="#9aa5ce" font-size="11.5">- which policy approved or blocked it</text>
  <text x="544" y="332" fill="#9aa5ce" font-size="11.5">- which external system it reached</text>

  <!-- dashed writes-to arrows from each step to the rail -->
  <line x1="364" y1="106" x2="518" y2="150" stroke="#e0af68" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arwGold)"/>
  <line x1="364" y1="198" x2="518" y2="200" stroke="#e0af68" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arwGold)"/>
  <line x1="364" y1="290" x2="518" y2="250" stroke="#e0af68" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arwGold)"/>
  <line x1="364" y1="382" x2="518" y2="300" stroke="#e0af68" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arwGold)"/>
  <text x="404" y="150" fill="#e0af68" font-size="10.5" font-style="italic">writes</text>

  <!-- bottom: reconstructable trail -->
  <rect x="176" y="536" width="548" height="60" rx="12" fill="#1f2937" stroke="#9ece6a" stroke-width="1.5"/>
  <text x="450" y="562" fill="#c0caf5" font-size="14.5" font-weight="700" text-anchor="middle">Reconstructable trail</text>
  <text x="450" y="582" fill="#9aa5ce" font-size="12" text-anchor="middle">who did what, when, and why — auditable after the fact</text>

  <!-- arrows converging into the trail -->
  <line x1="214" y1="500" x2="300" y2="534" stroke="#9ece6a" stroke-width="2" marker-end="url(#arwGreen)"/>
  <line x1="680" y1="500" x2="600" y2="534" stroke="#9ece6a" stroke-width="2" marker-end="url(#arwGreen)"/>
</svg>
