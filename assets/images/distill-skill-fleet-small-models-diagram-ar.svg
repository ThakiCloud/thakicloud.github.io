<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Inter, 'Noto Sans KR', sans-serif" direction="rtl">
  <rect width="1200" height="560" fill="#f7f9fc"/>
  <text x="600" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#1B4F72">بنية هجينة: تقطير المهارات المُتحقق منها إلى عمال نماذج صغيرة</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Stage 1 -->
  <g>
    <rect x="40" y="110" width="250" height="150" rx="14" fill="#e8f1fb" stroke="#1B4F72" stroke-width="2"/>
    <text x="165" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#1B4F72">1. أسطول المهارات المُتحقق منها</text>
    <text x="165" y="180" text-anchor="middle" font-size="12.5" fill="#2E4057">حتمية التنسيق = يملكها الكود</text>
    <text x="165" y="202" text-anchor="middle" font-size="12.5" fill="#2E4057">الأرقام · التعدادات · العرض</text>
    <text x="165" y="224" text-anchor="middle" font-size="12.5" fill="#2E4057">الأخبار · التغريدات · دفعات التقارير</text>
  </g>

  <!-- Stage 2 -->
  <g>
    <rect x="330" y="110" width="250" height="150" rx="14" fill="#e6f6f3" stroke="#0e8a76" stroke-width="2"/>
    <text x="455" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#0e8a76">2. معلّم متخصص لكل مهارة</text>
    <text x="455" y="180" text-anchor="middle" font-size="12.5" fill="#2E4057">نقطة تفتيش RL مخصصة للمجال</text>
    <text x="455" y="202" text-anchor="middle" font-size="12.5" fill="#2E4057">التخصص، لا الحجم</text>
    <text x="455" y="224" text-anchor="middle" font-size="12.5" fill="#2E4057">نفس النموذج الأساسي، تعميق مجال واحد</text>
  </g>

  <!-- Stage 3 -->
  <g>
    <rect x="620" y="110" width="250" height="150" rx="14" fill="#fef3e2" stroke="#c77d0a" stroke-width="2"/>
    <text x="745" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#c77d0a">3. التقطير أثناء السياسة</text>
    <text x="745" y="180" text-anchor="middle" font-size="12.5" fill="#2E4057">الطالب يولّد مساراته الخاصة</text>
    <text x="745" y="202" text-anchor="middle" font-size="12.5" fill="#2E4057">المعلّم يقيّم كل رمز على حدة</text>
    <text x="745" y="224" text-anchor="middle" font-size="12.5" fill="#2E4057">بوابة تحقق تزيل الإشارات السيئة</text>
  </g>

  <!-- Stage 4 -->
  <g>
    <rect x="910" y="110" width="250" height="150" rx="14" fill="#efeafc" stroke="#5b4bc4" stroke-width="2"/>
    <text x="1035" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#5b4bc4">4. عامل محلي صغير</text>
    <text x="1035" y="180" text-anchor="middle" font-size="12.5" fill="#2E4057">Gemma-4-26B ≈ Haiku</text>
    <text x="1035" y="202" text-anchor="middle" font-size="12.5" fill="#2E4057">التزام العامل 18 مقابل 18</text>
    <text x="1035" y="224" text-anchor="middle" font-size="12.5" fill="#2E4057">سقف سياق نحو 10 آلاف رمز</text>
  </g>

  <line x1="290" y1="185" x2="326" y2="185" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="185" x2="616" y2="185" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="870" y1="185" x2="906" y2="185" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Hybrid routing band -->
  <rect x="40" y="330" width="1120" height="120" rx="12" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="360" text-anchor="middle" font-size="15" font-weight="700" fill="#1B4F72">التوجيه الهجين: الإبقاء على الموجّه وتخفيض العامل فقط</text>

  <rect x="70" y="378" width="500" height="52" rx="10" fill="#e8f1fb" stroke="#1B4F72" stroke-width="1.5"/>
  <text x="320" y="401" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1B4F72">الموجّه الحدودي</text>
  <text x="320" y="420" text-anchor="middle" font-size="11.5" fill="#2E4057">استدلال ثقيل · سياق طويل · إدارة</text>

  <rect x="630" y="378" width="500" height="52" rx="10" fill="#efeafc" stroke="#5b4bc4" stroke-width="1.5"/>
  <text x="880" y="401" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b4bc4">عامل محلي صغير</text>
  <text x="880" y="420" text-anchor="middle" font-size="11.5" fill="#2E4057">مهام مُهيكلة · متكررة · تشغيل آلي بحجم كبير</text>

  <text x="600" y="495" text-anchor="middle" font-size="13" font-style="italic" fill="#5b4bc4">تصعيد قائم على المراجعة: البدء بالأرخص، وإعادة المهارات التي تفشل مرارا فقط إلى نموذج أعلى</text>
  <path d="M880,430 L880,470 L320,470 L320,432" fill="none" stroke="#5b4bc4" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
</svg>
