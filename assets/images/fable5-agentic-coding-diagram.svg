</g>
<g class="node" data-id="Test" data-label="Runs Tests" data-shape="rectangle">
  <rect x="68.48383333333328" y="784.4159999999999" width="109.381" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="123.17433333333328" y="802.866" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Runs Tests</text>
</g>
<g class="node" data-id="Verify" data-label="Self-verify Loop" data-shape="diamond">
  <polygon points="119.658,40 199.316,119.658 119.658,199.316 40,119.658" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="119.658" y="119.658" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Self-verify Loop</text>
</g>
<g class="node" data-id="Submit" data-label="Submit Change" data-shape="rectangle">
  <rect x="177.2925" y="291.616" width="128.647" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="241.61599999999999" y="310.066" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Submit Change</text>
</g>
<g class="node" data-id="Steer" data-label="Human Steers direction" data-shape="rectangle">
  <rect x="152.469" y="376.516" width="178.29399999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="241.61599999999999" y="394.966" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Human Steers direction</text>
</g>
<g class="node" data-id="class" data-label="class" data-shape="rectangle">
  <rect x="227.31599999999997" y="138.416" width="74.554" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
