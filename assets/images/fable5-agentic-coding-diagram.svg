<polyline class="edge" data-from="Verify" data-to="Write" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="fail" points="119.65800000000002,199.31599999999997 119.65800000000002,619.2160000000001 113.251,619.2160000000001 113.251,687.5160000000001 138.09816666666666,687.5160000000001 138.09816666666666,699.5160000000001" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
