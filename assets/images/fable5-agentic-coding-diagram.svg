  <rect x="209.61599999999999" y="456.41600000000005" width="63.38800000000001" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="241.31" y="471.56600000000003" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">new intent</text>
</g>
