  <rect x="143.57699999999997" y="529.7160000000001" width="196.078" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="241.61599999999999" y="548.1660000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Human sets Intent and Goal</text>
</g>
<g class="node" data-id="Plan" data-label="Agent Plans" data-shape="rectangle">
  <rect x="185.44349999999997" y="614.616" width="112.345" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
