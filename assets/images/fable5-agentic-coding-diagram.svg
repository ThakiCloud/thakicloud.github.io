<polyline class="edge" data-from="Submit" data-to="Steer" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="241.61599999999999,328.516 241.61599999999999,376.516" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Steer" data-to="Human" data-style="dotted" data-arrow-start="false" data-arrow-end="true" data-label="new intent" points="241.61599999999999,413.416 241.61599999999999,529.7160000000001" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrowhead)" />
