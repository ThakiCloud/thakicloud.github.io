  <text x="357.67099999999994" y="168.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="357.67099999999994" dy="-3.9000000000000012">Value does not vanish,</tspan><tspan x="357.67099999999994" dy="16.900000000000002">it moves up one layer</tspan></text>
