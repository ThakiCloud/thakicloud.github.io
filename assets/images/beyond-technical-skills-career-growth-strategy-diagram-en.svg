<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Inter, 'Noto Sans KR', sans-serif">
  <rect width="1200" height="560" fill="#f7f9fc"/>
  <text x="600" y="46" text-anchor="middle" font-size="25" font-weight="700" fill="#1B4F72">Four Competencies That Create Impact, and Agency</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Foundation: technical -->
  <rect x="120" y="96" width="960" height="66" rx="12" fill="#e8f1fb" stroke="#1B4F72" stroke-width="2"/>
  <text x="600" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#1B4F72">Technical Skill · Foundation and Entry Ticket</text>
  <text x="600" y="149" text-anchor="middle" font-size="13" fill="#2E4057">Measurable and built through practice. It gets you into the conversation, but doesn't set you apart alone.</text>

  <line x1="290" y1="162" x2="290" y2="196" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="162" x2="600" y2="196" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="910" y1="162" x2="910" y2="196" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Three pillars -->
  <g>
    <rect x="120" y="200" width="300" height="130" rx="14" fill="#e6f6f3" stroke="#0e8a76" stroke-width="2"/>
    <text x="270" y="236" text-anchor="middle" font-size="17" font-weight="700" fill="#0e8a76">Product Thinking</text>
    <text x="270" y="266" text-anchor="middle" font-size="13" fill="#2E4057">Judge what is valuable</text>
    <text x="270" y="288" text-anchor="middle" font-size="13" fill="#2E4057">Choose the right problem</text>
    <text x="270" y="310" text-anchor="middle" font-size="13" fill="#2E4057">Needs · priorities · market</text>
  </g>

  <g>
    <rect x="450" y="200" width="300" height="130" rx="14" fill="#fef3e2" stroke="#c77d0a" stroke-width="2"/>
    <text x="600" y="236" text-anchor="middle" font-size="17" font-weight="700" fill="#c77d0a">Project Execution</text>
    <text x="600" y="266" text-anchor="middle" font-size="13" fill="#2E4057">Turn plans into results</text>
    <text x="600" y="288" text-anchor="middle" font-size="13" fill="#2E4057">Structure · timeline · momentum</text>
    <text x="600" y="310" text-anchor="middle" font-size="13" fill="#2E4057">Push through obstacles</text>
  </g>

  <g>
    <rect x="780" y="200" width="300" height="130" rx="14" fill="#efeafc" stroke="#5b4bc4" stroke-width="2"/>
    <text x="930" y="236" text-anchor="middle" font-size="17" font-weight="700" fill="#5b4bc4">Interpersonal Skill</text>
    <text x="930" y="266" text-anchor="middle" font-size="13" fill="#2E4057">Work with and influence others</text>
    <text x="930" y="288" text-anchor="middle" font-size="12" fill="#2E4057">Communicate, persuade, resolve conflicts</text>
    <text x="930" y="310" text-anchor="middle" font-size="13" fill="#2E4057">Align stakeholders, win support</text>
  </g>

  <line x1="270" y1="330" x2="560" y2="372" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="330" x2="600" y2="372" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="930" y1="330" x2="640" y2="372" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Convergence: meaningful achievement -->
  <rect x="360" y="378" width="480" height="60" rx="12" fill="#1B4F72"/>
  <text x="600" y="405" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Meaningful Achievement</text>
  <text x="600" y="427" text-anchor="middle" font-size="12.5" fill="#dbe7f5">All four competencies work together</text>

  <!-- Agency band -->
  <rect x="120" y="470" width="600" height="62" rx="12" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="497" text-anchor="middle" font-size="15" font-weight="700" fill="#1B4F72">Driven by Agency</text>
  <text x="420" y="519" text-anchor="middle" font-size="12.5" fill="#2E4057">The choice to take ownership instead of waiting. You can decide right now.</text>

  <!-- Feedback loop -->
  <rect x="760" y="470" width="320" height="62" rx="12" fill="#e6f6f3" stroke="#0e8a76" stroke-width="1.5"/>
  <text x="920" y="497" text-anchor="middle" font-size="15" font-weight="700" fill="#0e8a76">Feedback Loop</text>
  <text x="920" y="519" text-anchor="middle" font-size="12.5" fill="#2E4057">Find the weakest link and fix it first</text>
  <path d="M920,470 L920,340 L620,330" fill="none" stroke="#0e8a76" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
</svg>
