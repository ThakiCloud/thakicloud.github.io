  <rect x="91.46383333333331" y="481" width="184.96300000000002" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="183.94533333333334" y="507.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="183.94533333333334" dy="-3.9000000000000012">Real-time Streaming UI</tspan><tspan x="183.94533333333334" dy="16.900000000000002">(incremental responses)</tspan></text>
</g>
