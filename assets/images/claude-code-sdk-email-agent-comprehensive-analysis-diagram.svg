  <text x="169.8285" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="169.8285" dy="-3.9000000000000012">IMAP Mailbox</tspan><tspan x="169.8285" dy="16.900000000000002">(fetch, sync)</tspan></text>
</g>
