  <text x="169.8285" y="177.15" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="169.8285" dy="-12.350000000000001">Claude Code SDK Agent</tspan><tspan x="169.8285" dy="16.900000000000002">(natural-language query,</tspan><tspan x="169.8285" dy="16.900000000000002">tool use, streaming)</tspan></text>
</g>
