  <rect x="40" y="379.2" width="169.402" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="124.701" y="406.09999999999997" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="124.701" dy="-3.9000000000000012">AI Email Search</tspan><tspan x="124.701" dy="16.900000000000002">(intent parse, ranking)</tspan></text>
</g>
