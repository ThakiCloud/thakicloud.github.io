  <rect x="90.0735" y="260.5" width="160.51" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="170.3285" y="295.85" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="170.3285" dy="-12.350000000000001">SQLite Cache</tspan><tspan x="170.3285" dy="16.900000000000002">(messages, threads,</tspan><tspan x="170.3285" dy="16.900000000000002">embeddings)</tspan></text>
</g>
<g class="node" data-id="STREAM" data-label="Real-time Streaming UI
