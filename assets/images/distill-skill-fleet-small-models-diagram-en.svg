<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Inter, 'Noto Sans KR', sans-serif">
  <rect width="1200" height="560" fill="#f7f9fc"/>
  <text x="600" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#1B4F72">Hybrid Architecture: Distilling Validated Skills into Small Workers</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Stage 1 -->
  <g>
    <rect x="40" y="110" width="250" height="150" rx="14" fill="#e8f1fb" stroke="#1B4F72" stroke-width="2"/>
    <text x="165" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#1B4F72">1. Validated Skill Fleet</text>
    <text x="165" y="180" text-anchor="middle" font-size="13" fill="#2E4057">Format determinism = code owned</text>
    <text x="165" y="202" text-anchor="middle" font-size="13" fill="#2E4057">Numbers · enums · rendering</text>
    <text x="165" y="224" text-anchor="middle" font-size="13" fill="#2E4057">News · tweets · report batches</text>
  </g>

  <!-- Stage 2 -->
  <g>
    <rect x="330" y="110" width="250" height="150" rx="14" fill="#e6f6f3" stroke="#0e8a76" stroke-width="2"/>
    <text x="455" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#0e8a76">2. Per-Skill Teacher</text>
    <text x="455" y="180" text-anchor="middle" font-size="13" fill="#2E4057">Domain RL checkpoint</text>
    <text x="455" y="202" text-anchor="middle" font-size="13" fill="#2E4057">Specialization, not size</text>
    <text x="455" y="224" text-anchor="middle" font-size="13" fill="#2E4057">Same base, one domain deepened</text>
  </g>

  <!-- Stage 3 -->
  <g>
    <rect x="620" y="110" width="250" height="150" rx="14" fill="#fef3e2" stroke="#c77d0a" stroke-width="2"/>
    <text x="745" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#c77d0a">3. On-Policy Distillation</text>
    <text x="745" y="180" text-anchor="middle" font-size="13" fill="#2E4057">Student generates own rollouts</text>
    <text x="745" y="202" text-anchor="middle" font-size="13" fill="#2E4057">Teacher grades token by token</text>
    <text x="745" y="224" text-anchor="middle" font-size="13" fill="#2E4057">Verify gate filters bad signal</text>
  </g>

  <!-- Stage 4 -->
  <g>
    <rect x="910" y="110" width="250" height="150" rx="14" fill="#efeafc" stroke="#5b4bc4" stroke-width="2"/>
    <text x="1035" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#5b4bc4">4. Small Local Worker</text>
    <text x="1035" y="180" text-anchor="middle" font-size="13" fill="#2E4057">Gemma-4-26B ≈ Haiku</text>
    <text x="1035" y="202" text-anchor="middle" font-size="13" fill="#2E4057">Worker compliance 18 to 18</text>
    <text x="1035" y="224" text-anchor="middle" font-size="13" fill="#2E4057">About 10K token context ceiling</text>
  </g>

  <line x1="290" y1="185" x2="326" y2="185" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="185" x2="616" y2="185" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="870" y1="185" x2="906" y2="185" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Hybrid routing band -->
  <rect x="40" y="330" width="1120" height="120" rx="12" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#1B4F72">Hybrid routing: keep the conductor, downgrade only the worker</text>

  <rect x="70" y="378" width="500" height="52" rx="10" fill="#e8f1fb" stroke="#1B4F72" stroke-width="1.5"/>
  <text x="320" y="401" text-anchor="middle" font-size="13" font-weight="700" fill="#1B4F72">Frontier Conductor</text>
  <text x="320" y="420" text-anchor="middle" font-size="12" fill="#2E4057">Heavy reasoning · long context · orchestration</text>

  <rect x="630" y="378" width="500" height="52" rx="10" fill="#efeafc" stroke="#5b4bc4" stroke-width="1.5"/>
  <text x="880" y="401" text-anchor="middle" font-size="13" font-weight="700" fill="#5b4bc4">Local Small Worker</text>
  <text x="880" y="420" text-anchor="middle" font-size="12" fill="#2E4057">Structured · repetitive · high-volume unattended runs</text>

  <text x="600" y="495" text-anchor="middle" font-size="13.5" font-style="italic" fill="#5b4bc4">Retro-driven escalation: start cheap, and only skills with repeated failures get moved back to a bigger model</text>
  <path d="M880,430 L880,470 L320,470 L320,432" fill="none" stroke="#5b4bc4" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
</svg>
