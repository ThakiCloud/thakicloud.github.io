<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 479.40799999999996 638.951" width="479.40799999999996" height="638.951" style="--bg:#1a1b26;--fg:#a9b1d6">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="REQ" data-to="SCHED" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="113.21549999999999,85.35000000000001 113.21549999999999,122.025 220.0675,122.025 220.0675,141.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="RESID" data-to="SCHED" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="326.91949999999997,102.25 326.91949999999997,122.025 220.0675,122.025 220.0675,141.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="SCHED" data-to="COND" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="220.0675,195.60000000000002 220.0675,243.60000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="COND" data-to="SPEC" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="idle GPU: up to 2x speedup" points="189.19233333333332,397.97583333333336 189.19233333333332,464.851 132.85199999999998,464.851 132.85199999999998,545.1510000000001" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="COND" data-to="PLAIN" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="saturated GPU: net loss" points="250.94266666666664,397.97583333333336 250.94266666666664,464.851 307.283,464.851 307.283,545.1510000000001" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="COND" data-to="SPEC" data-label="idle GPU: up to 2x speedup">
  <rect x="62.35199999999999" y="471.851" width="140.60800000000003" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="132.656" y="487.001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">idle GPU: up to 2x speedup</text>
</g>
<g class="edge-label" data-from="COND" data-to="PLAIN" data-label="saturated GPU: net loss">
  <rect x="243.783" y="471.851" width="126.35200000000002" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="306.959" y="487.001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">saturated GPU: net loss</text>
</g>
<g class="node" data-id="REQ" data-label="Inference request" data-shape="rectangle">
