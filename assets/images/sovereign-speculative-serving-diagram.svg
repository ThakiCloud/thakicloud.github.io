  <rect x="214.43099999999998" y="48.45" width="224.97699999999995" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="326.91949999999997" y="75.35000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="326.91949999999997" dy="-3.9000000000000012">Data-residency hard constraint</tspan><tspan x="326.91949999999997" dy="16.900000000000002">(checked before speedup)</tspan></text>
</g>
<g class="node" data-id="COND" data-label="Accept speculation?
self-benefit AND
neighbor SLO slack" data-shape="diamond">
  <polygon points="220.0675,243.60000000000002 312.693,336.2255 220.0675,428.851 127.442,336.2255" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="220.0675" y="336.2255" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="220.0675" dy="-12.350000000000001">Accept speculation?</tspan><tspan x="220.0675" dy="16.900000000000002">self-benefit AND</tspan><tspan x="220.0675" dy="16.900000000000002">neighbor SLO slack</tspan></text>
</g>
<g class="node" data-id="SPEC" data-label="Speculative decode
