  <text x="132.85199999999998" y="572.051" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="132.85199999999998" dy="-3.9000000000000012">Speculative decode</tspan><tspan x="132.85199999999998" dy="16.900000000000002">(draft plus verify)</tspan></text>
</g>
<g class="node" data-id="PLAIN" data-label="Plain decode
(no speculation)" data-shape="rectangle">
  <rect x="239.9955" y="545.1510000000001" width="134.575" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="307.283" y="572.051" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="307.283" dy="-3.9000000000000012">Plain decode</tspan><tspan x="307.283" dy="16.900000000000002">(no speculation)</tspan></text>
</g>
</svg>