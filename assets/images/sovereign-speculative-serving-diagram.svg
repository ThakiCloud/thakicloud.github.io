  <rect x="101.65099999999998" y="141.8" width="236.833" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="220.0675" y="168.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="220.0675" dy="-3.9000000000000012">SovereignSpec scheduler</tspan><tspan x="220.0675" dy="16.900000000000002">(reads spare-compute headroom)</tspan></text>
</g>
<g class="node" data-id="RESID" data-label="Data-residency hard constraint
