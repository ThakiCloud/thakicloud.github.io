<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#555"/></marker></defs><rect width="960" height="250" fill="#fff"/><rect x="20" y="30" width="150" height="70" rx="8" fill="#eef3ea" stroke="#2f5d3a" stroke-width="1.5"/><text x="95.0" y="70.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1b1b1b">User request</text><line x1="170" y1="65" x2="200" y2="65" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/><rect x="200" y="30" width="200" height="70" rx="8" fill="#eef3ea" stroke="#2f5d3a" stroke-width="1.5"/><text x="300.0" y="61.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1b1b1b">Edge pre-check</text><text x="300.0" y="79.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1b1b1b">(Bolt-based classifier)</text><line x1="400" y1="65" x2="430" y2="65" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/><rect x="430" y="30" width="200" height="70" rx="8" fill="#fdf3dc" stroke="#2f5d3a" stroke-width="1.5"/><text x="530.0" y="61.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1b1b1b">Deterministic permission</text><text x="530.0" y="79.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1b1b1b">check (outside the model)</text><line x1="630" y1="65" x2="660" y2="65" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/><rect x="660" y="30" width="170" height="70" rx="8" fill="#eef3ea" stroke="#2f5d3a" stroke-width="1.5"/><text x="745.0" y="61.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1b1b1b">Agent / tool</text><text x="745.0" y="79.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1b1b1b">execution</text><text x="300" y="125" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">The model only proposes</text><text x="530" y="125" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">Code decides what may run</text><line x1="745" y1="100" x2="745" y2="160" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/><rect x="620" y="160" width="250" height="70" rx="8" fill="#eef3ea" stroke="#2f5d3a" stroke-width="1.5"/><text x="745.0" y="191.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1b1b1b">RCA step (read-only)</text><text x="745.0" y="209.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1b1b1b">cite evidence or abstain</text><line x1="620" y1="195" x2="520" y2="195" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/><rect x="330" y="160" width="190" height="70" rx="8" fill="#eef3ea" stroke="#2f5d3a" stroke-width="1.5"/><text x="425.0" y="200.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1b1b1b">Ask for next tool</text></svg>