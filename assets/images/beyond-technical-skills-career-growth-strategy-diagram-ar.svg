<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Inter, 'Noto Sans KR', sans-serif" direction="rtl">
  <rect width="1200" height="560" fill="#f7f9fc"/>
  <text x="600" y="46" text-anchor="middle" font-size="25" font-weight="700" fill="#1B4F72">المبادئ الأربعة التي تصنع التأثير، والوكالة</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Foundation: technical -->
  <rect x="120" y="96" width="960" height="66" rx="12" fill="#e8f1fb" stroke="#1B4F72" stroke-width="2"/>
  <text x="600" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#1B4F72">المهارة التقنية · الأساس وتذكرة الدخول</text>
  <text x="600" y="149" text-anchor="middle" font-size="13" fill="#2E4057">قابلة للقياس وتُبنى بالممارسة. ضرورية لتكون في الحوار، لكنها وحدها لا تُميّزك.</text>

  <line x1="290" y1="162" x2="290" y2="196" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="162" x2="600" y2="196" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="910" y1="162" x2="910" y2="196" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Three pillars -->
  <g>
    <rect x="120" y="200" width="300" height="130" rx="14" fill="#e6f6f3" stroke="#0e8a76" stroke-width="2"/>
    <text x="270" y="236" text-anchor="middle" font-size="17" font-weight="700" fill="#0e8a76">التفكير في المنتج</text>
    <text x="270" y="266" text-anchor="middle" font-size="13" fill="#2E4057">الحكم على ما هو ذو قيمة</text>
    <text x="270" y="288" text-anchor="middle" font-size="13" fill="#2E4057">اختيار المشكلة الصحيحة</text>
    <text x="270" y="310" text-anchor="middle" font-size="13" fill="#2E4057">الاحتياجات · الأولويات · قراءة السوق</text>
  </g>

  <g>
    <rect x="450" y="200" width="300" height="130" rx="14" fill="#fef3e2" stroke="#c77d0a" stroke-width="2"/>
    <text x="600" y="236" text-anchor="middle" font-size="17" font-weight="700" fill="#c77d0a">تنفيذ المشروع</text>
    <text x="600" y="266" text-anchor="middle" font-size="13" fill="#2E4057">تحويل الخطط إلى نتائج</text>
    <text x="600" y="288" text-anchor="middle" font-size="13" fill="#2E4057">الهيكلة · الجدول الزمني · الزخم</text>
    <text x="600" y="310" text-anchor="middle" font-size="13" fill="#2E4057">المضي قدمًا رغم العقبات</text>
  </g>

  <g>
    <rect x="780" y="200" width="300" height="130" rx="14" fill="#efeafc" stroke="#5b4bc4" stroke-width="2"/>
    <text x="930" y="236" text-anchor="middle" font-size="17" font-weight="700" fill="#5b4bc4">مهارات التعامل مع الآخرين</text>
    <text x="930" y="266" text-anchor="middle" font-size="13" fill="#2E4057">العمل مع الآخرين والتأثير فيهم</text>
    <text x="930" y="288" text-anchor="middle" font-size="13" fill="#2E4057">التواصل · الإقناع · حل النزاعات</text>
    <text x="930" y="310" text-anchor="middle" font-size="13" fill="#2E4057">مواءمة أصحاب المصلحة وكسب الدعم</text>
  </g>

  <line x1="270" y1="330" x2="560" y2="372" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="330" x2="600" y2="372" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="930" y1="330" x2="640" y2="372" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Convergence: meaningful achievement -->
  <rect x="360" y="378" width="480" height="60" rx="12" fill="#1B4F72"/>
  <text x="600" y="405" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">إنجاز ذو معنى</text>
  <text x="600" y="427" text-anchor="middle" font-size="12.5" fill="#dbe7f5">تعمل المبادئ الأربعة كلها معًا</text>

  <!-- Agency band -->
  <rect x="120" y="470" width="600" height="62" rx="12" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="497" text-anchor="middle" font-size="15" font-weight="700" fill="#1B4F72">تقودها الوكالة</text>
  <text x="420" y="519" text-anchor="middle" font-size="12.5" fill="#2E4057">اختيار تولي الملكية بدلاً من الانتظار. قرار يمكنك اتخاذه الآن.</text>

  <!-- Feedback loop -->
  <rect x="760" y="470" width="320" height="62" rx="12" fill="#e6f6f3" stroke="#0e8a76" stroke-width="1.5"/>
  <text x="920" y="497" text-anchor="middle" font-size="15" font-weight="700" fill="#0e8a76">حلقة التغذية الراجعة</text>
  <text x="920" y="519" text-anchor="middle" font-size="12.5" fill="#2E4057">إيجاد أضعف حلقة وإصلاحها أولاً</text>
  <path d="M920,470 L920,340 L620,330" fill="none" stroke="#0e8a76" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
</svg>
