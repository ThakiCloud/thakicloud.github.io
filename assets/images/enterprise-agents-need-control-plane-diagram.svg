<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" style="--bg:#1a1b26;--fg:#a9b1d6;--line:#3d59a1;--accent:#7aa2f7;--muted:#565f89;--surface:#24283b;--danger:#f7768e;--ok:#9ece6a;background:var(--bg)">
  <style>
    text { font-family: 'Inter', system-ui, -apple-system, sans-serif; fill: var(--fg); }
    .title { font-size: 15px; font-weight: 700; }
    .lbl { font-size: 14px; font-weight: 600; }
    .sub { font-size: 11.5px; fill: var(--muted); font-weight: 500; }
    .edge { font-size: 11px; font-weight: 600; }
    .node { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; rx: 10; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="var(--accent)" />
    </marker>
  </defs>

  <!-- caption band -->
  <text x="480" y="34" text-anchor="middle" class="title" fill="#7aa2f7">Agent-Native control plane: every action passes a policy gate and audit log</text>

  <!-- Row 1: Agent action -->
  <rect class="node" x="300" y="58" width="360" height="60" rx="10"/>
  <text x="480" y="84" text-anchor="middle" class="lbl">Agent action</text>
  <text x="480" y="104" text-anchor="middle" class="sub">schedule &#183; run code &#183; call tool &#183; read team wiki</text>
  <path class="flow" d="M480 118 L480 148" marker-end="url(#ah)"/>

  <!-- Row 2: Policy Gate (diamond) -->
  <polygon class="node" points="480,150 612,205 480,260 348,205" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"/>
  <text x="480" y="200" text-anchor="middle" class="lbl">Policy Gate</text>
  <text x="480" y="220" text-anchor="middle" class="sub">autonomy &amp; approval rules</text>

  <!-- denied branch -->
  <path class="flow" d="M612 205 L742 205" marker-end="url(#ah)"/>
  <text x="672" y="196" text-anchor="middle" class="edge" fill="#f7768e">denied</text>
  <rect class="node" x="742" y="178" width="150" height="54" rx="10" stroke="var(--danger)"/>
  <text x="817" y="203" text-anchor="middle" class="lbl">Blocked</text>
  <text x="817" y="221" text-anchor="middle" class="sub">and logged</text>

  <!-- allowed branch down -->
  <path class="flow" d="M480 260 L480 296" marker-end="url(#ah)"/>
  <text x="500" y="284" text-anchor="start" class="edge" fill="#9ece6a">allowed</text>

  <!-- Row 3: Skills -> Tools -> Sandbox -->
  <rect class="node" x="70" y="298" width="240" height="58" rx="10"/>
  <text x="190" y="322" text-anchor="middle" class="lbl">Skills registry</text>
  <text x="190" y="340" text-anchor="middle" class="sub">versioned, verified, revocable</text>

  <rect class="node" x="360" y="298" width="240" height="58" rx="10"/>
  <text x="480" y="322" text-anchor="middle" class="lbl">Tools</text>
  <text x="480" y="340" text-anchor="middle" class="sub">declarative access scope</text>

  <rect class="node" x="650" y="298" width="240" height="58" rx="10"/>
  <text x="770" y="322" text-anchor="middle" class="lbl">Isolated sandbox</text>
  <text x="770" y="340" text-anchor="middle" class="sub">contained execution</text>

  <path class="flow" d="M480 296 L480 298"/>
  <path class="flow" d="M360 327 L310 327" marker-end="url(#ah)"/>
  <path class="flow" d="M600 327 L650 327" marker-end="url(#ah)"/>

  <!-- converge to Audit Logs -->
  <path class="flow" d="M190 356 L190 420 L470 420" marker-end="url(#ah)"/>
  <path class="flow" d="M770 356 L770 420 L490 420" marker-end="url(#ah)"/>
  <path class="flow" d="M817 232 L817 420 L490 420"/>

  <!-- Row 4: Audit Logs -->
  <rect class="node" x="300" y="418" width="360" height="60" rx="10" stroke="var(--accent)" stroke-width="1.6"/>
  <text x="480" y="444" text-anchor="middle" class="lbl">Audit Logs</text>
  <text x="480" y="464" text-anchor="middle" class="sub">every action recorded, reconstructable by default</text>
  <path class="flow" d="M480 478 L480 510" marker-end="url(#ah)"/>

  <!-- Row 5: Sovereign K8s foundation -->
  <rect class="node" x="180" y="512" width="600" height="60" rx="10" fill="#20243a" stroke="var(--line)"/>
  <text x="480" y="538" text-anchor="middle" class="lbl">Sovereign Kubernetes</text>
  <text x="480" y="558" text-anchor="middle" class="sub">on-prem &#183; air-gapped &#183; verified skill / tool / data supply chain</text>
</svg>
