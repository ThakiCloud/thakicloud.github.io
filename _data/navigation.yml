# ------- main links (default - Korean) ---------------------------------------
main:
  - title: "제품"
    children: *product_children_ko
  - title: "Tech Blog"
    url: /ko/
  - title: "회사 소개"
    url: "https://thakicloud.com/company"
  - title: "문의하기"
    url: "https://thakicloud.com/contact"
  - title: "언어"
    type: language
    children:
      - title: "한국어"
        url: /ko/
      - title: "English"
        url: /en/

# ------- 한국어 네비게이션 -----------------------------------------------------
