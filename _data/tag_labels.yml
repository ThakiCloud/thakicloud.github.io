# Locale-aware display labels for post-footer tags — consumed by
# _includes/tag-list.html so a tag written in one language's frontmatter
# (e.g. Korean tags on an EN/AR post) still displays in the reading
# post's own language (page.lang).
#
# Keys are the raw tag strings used in post front matter (any of the
# surface forms a concept appears as, e.g. both the Korean phrase for
# "context engineering" and the English slug "context-engineering"
# map to the same {ko, en, ar} triple). Each
# key's own-language value equals the key itself (self-mapping
# invariant), so map[tag_word][page.lang] always resolves correctly
# regardless of which language's frontmatter the tag came from.
#
# Proper nouns and established technical terms (Claude Code, LLM, GPU,
# Kubernetes, vLLM, agentops, thakicloud, ...) are intentionally NOT
# listed here: they render identically in every language already, so
# the renderer's default fallback (raw tag_word) is correct without an
# entry. Only tags whose displayed label should actually change by
# language are mapped.
#
# Generated from a full scan of _posts/{ko,en,ar}/**/*.md frontmatter
# tags (see thakicloud.github.io tag-i18n build notes). Unmapped tags
# fall back to the raw tag_word — nothing breaks if a tag is missing.

