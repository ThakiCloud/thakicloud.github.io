  consent_req_body: |-
    「개인정보 보호법」 제15조에 따라 아래 4개 항목을 확인하시고 동의해 주십시오.
    1. 수집·이용 목적: 상담 요청 및 문의 대응, 계약·서비스 제공을 위한 기본 정보 확인
    2. 수집 항목: 이름, 회사 이메일, 회사명, 부서, 직책, 연락처, 국가, 요청 유형
    3. 보유·이용 기간: 수집일로부터 3년
    4. 동의 거부 권리 및 불이익: 귀하는 동의를 거부할 권리가 있으며, 거부 시 문의 접수 및 응대가 제한됩니다.
  consent_req_label: "(필수) 개인정보의 수집 및 이용에 동의합니다."
  consent_mkt_title: "마케팅 목적 이용 동의 (선택)"
  consent_mkt_body: |-
    아래 4개 항목을 확인하시고 동의해 주십시오.
    1. 수집·이용 목적: 제품·서비스 관련 소식 제공, 웨비나·전시 등 행사 안내, 뉴스레터 발송
    2. 수집 항목: 이름, 이메일, 회사명
    3. 보유·이용 기간: 수집일로부터 3년
    4. 동의 거부 권리 및 불이익: 동의를 거부할 권리가 있으며, 거부하셔도 상담 및 서비스 이용에는 제한이 없습니다. 다만 행사 안내·뉴스레터는 수신하실 수 없습니다.
  consent_mkt_label: "(선택) 다키클라우드코리아 제품 관련 마케팅 및 광고 목적의 활용에 동의합니다."
  consent_note: "위에 입력하신 운영 조건(업무 수, GPU, 요청량 등)은 개인정보가 아닌 업무 정보로, 진단을 위해 함께 전달됩니다. 이 페이지는 이용 통계를 위해 Google Analytics를 사용하며, 이름·이메일 등 개인정보는 Google Analytics로 보내지 않습니다."
  policy: "개인정보 처리 방침"
  policy_url: "https://thakicloud.com/privacy-statement/privacy"
  how_h: "계산 방식과 가정"
  how: |
    <p>업무별 GPU 부하는 피크 요청률 × (입력 토큰 ÷ prefill 처리량 + 출력 토큰 ÷ decode 처리량)으로 계산합니다. Multi-LoRA는 LoRA 처리 효율 0.85를 가정해 이 값을 나눕니다(미측정). 배포마다 필요한 GPU 수는 최소 복제 수, 부하 ÷ 지연 목표에 따른 사용률 상한, 피크 동시 처리 수 × 요청당 KV 메모리 ÷ GPU당 KV 여유 중 가장 큰 값입니다.</p>
    <p>우리 B200 실행에서 잰 값은 GPU 메모리 179.06 GiB, NVFP4 27B 모델 로딩 30.51 GiB, 로딩 뒤 KV 캐시 가용 104.33 GiB, r16 어댑터 445 MiB입니다. 엔진 오버헤드 26.31 GiB는 이 값에서 역산했습니다. 처리량 범위(prefill 1만·2만·4만, decode 1,250·2,500·5,000 토큰/초), 문맥 길이별 KV 메모리(1·2·6 GiB), 지연 목표별 사용률 상한(0.5·0.6·0.8)은 예시 가정입니다. H100·H200은 공개 메모리 사양만 반영했고, NVFP4는 Blackwell 세대 기능이라 실제로는 다른 정밀도와 모델 크기를 써야 할 수 있습니다.</p>
    <p>공유 구성은 모든 업무의 피크가 동시에 겹친다고 보고 계산합니다. 독립 배치(A′)는 한 GPU에 여러 엔진을 띄울 때의 간섭을 넣지 않아 독립 쪽에 유리합니다. 공유 구성은 엔진 하나가 멈추면 모든 업무가 영향을 받고, 품질 검증을 통과한 어댑터만 같은 엔진에 올려야 합니다.</p>
en:
  h1: "Adding GPUs every time you add a specialized AI?"
  lead: "A free GPU cost pre-assessment. Enter how many specialized AI models you run or plan to run, your GPU type, monthly requests, concurrency, and latency target. We estimate how many GPUs you need when each task gets its own model deployment versus when one base model shares per-task LoRA adapters. If sharing comes out more expensive for your workload, the estimate shows that too."
  checked_h: "What we verified and what we did not"
  checked: "On a single B200 GPU, ThakiCloud served nine models at once: one NVFP4 27B base model with eight task-specific LoRA adapters. We confirmed that requests for different adapters in the same batch do not mix their computation, and that the prefix cache is never reused across adapter or tenant boundaries (1,732 requests, 0 wrong reuses)."
  unchecked: "We have not measured throughput, latency, or actual cost savings, and answer quality per task needs separate validation. Every figure below is an estimate under your inputs."
  post_link: "Read the full validation"
  post_url: "/en/llmops/b200-nvfp4-multilora-kernel-isolation/"
  step1: "1. Your workload"
  f_models: "Number of specialized AI models (tasks)"
  f_gpu: "GPU type"
  gpu_b200: "NVIDIA B200 (memory measured)"
  gpu_h200: "NVIDIA H200 (public spec, assumed)"
  gpu_h100: "NVIDIA H100 80GB (public spec, assumed)"
  f_requests: "Monthly requests (all tasks combined)"
  f_dist: "Request split across tasks"
  dist_even: "Roughly even"
  dist_skewed: "Concentrated in two tasks (70%)"
  f_peak: "Peak factor <small>(peak rate ÷ average)</small>"
  f_concurrency: "Peak concurrent requests <small>(all tasks)</small>"
  f_sla: "Latency target"
  sla_strict: "Strict (interactive)"
  sla_normal: "Standard"
  sla_relaxed: "Relaxed (batch, async)"
  f_ha: "Redundancy"
  ha_no: "None (one copy per task)"
  ha_yes: "Yes (two copies)"
  f_ctx: "Context length per request"
  ctx_short: "Short (a few thousand tokens)"
  ctx_mid: "Medium (tens of thousands)"
  ctx_long: "Long (long documents)"
  f_in: "Average input tokens per request"
  f_out: "Average output tokens per request"
  f_price: "Hourly price per GPU <small>(optional, any currency)</small>"
  calc: "Estimate"
  step2: "2. Estimate"
  result_note: "A gives each task its own GPUs. A′ packs per-task instances onto shared GPUs as far as memory and compute allow, and is the strongest baseline. Throughput has not been measured, so we compute low, mid, and high cases."
  step3: "3. Request a free assessment"
  form_lead: "An engineer will review your inputs and send back an estimated TCO, an applicability call, and the quality checks that remain before adoption. There is no charge."
