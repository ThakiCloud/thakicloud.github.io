ko:
  h1: "전문 AI가 늘어날 때마다 GPU도 늘리고 계신가요?"
  lead: "무료 GPU 비용 사전 진단입니다. 운영 중이거나 계획 중인 전문 AI의 수, GPU 종류, 월 요청 수, 동시 처리 수, 지연 목표를 넣으면 업무별로 모델을 따로 띄울 때와 Base 모델 하나에 업무별 LoRA를 붙여 공유할 때의 GPU 수를 추정합니다. 공유 구성이 더 비싸게 나오는 조건도 그대로 보여 드립니다."
  checked_h: "확인한 것과 확인하지 않은 것"
  checked: "다키클라우드는 B200 GPU 한 장에서 NVFP4 27B Base 모델 하나에 업무별 LoRA 8개를 붙여 9개 모델을 함께 서빙했습니다. 서로 다른 어댑터 요청이 한 배치에 섞여도 계산이 섞이지 않는 것과, Prefix Cache가 어댑터·테넌트 경계를 넘어 재사용되지 않는 것(1,732건 요청, 잘못된 재사용 0건)을 확인했습니다."
  unchecked: "처리량, 응답 시간, 실제 비용 절감률은 아직 재지 않았습니다. 업무별 답변 품질도 별도 검증이 필요합니다. 그래서 아래 계산 결과는 모두 입력 가정에 따른 추정치입니다."
