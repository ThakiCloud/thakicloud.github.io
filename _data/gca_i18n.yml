  consent_req_title: "Consent to the Collection and Use of Personal Information (Required)"
  consent_req_body: |-
    Pursuant to Article 15 of PIPA, please review and agree to the following four items.
    1. Purpose: To respond to consultation requests and inquiries, and to verify basic information for contract execution and service provision
    2. Items collected: Name, work email, company name, department, job title, contact number, country, request type
    3. Retention period: 3 years from the date of collection
    4. Right to refuse & consequences: You have the right to refuse consent. If you refuse, we cannot receive or respond to your inquiry.
  consent_req_label: "(Required) I consent to the collection and use of my personal information."
  consent_mkt_title: "Consent to Use for Marketing Purposes (Optional)"
  consent_mkt_body: |-
    Please review and agree to the following four items.
    1. Purpose: Providing product/service news, event invitations (webinars, exhibitions), and newsletters
    2. Items collected: Name, email, company name
    3. Retention period: 3 years from the date of collection
    4. Right to refuse & consequences: You may refuse consent. Refusal does not limit consultation or service use, but you will not receive event invitations or newsletters.
  consent_mkt_label: "(Optional) I consent to the use of my information for marketing and advertising related to Thaki Cloud Korea products."
  consent_note: "The workload details above (task count, GPU, request volume, and so on) are business information, not personal information, and are sent with your request for the assessment. This page uses Google Analytics for usage statistics; your name, email, and other personal information are never sent to Google Analytics."
  policy: "Privacy Policy"
  policy_url: "https://thakicloud.com/privacy-statement/privacy"
  how_h: "How the estimate works"
  how: |
    <p>Per-task GPU load is peak request rate × (input tokens ÷ prefill throughput + output tokens ÷ decode throughput). For Multi-LoRA, this is divided by an assumed LoRA efficiency of 0.85 (not measured). Each deployment needs the largest of: the minimum replica count, load ÷ the utilization cap for your latency target, and peak concurrency × KV memory per request ÷ KV headroom per GPU.</p>
    <p>Measured on our B200 run: 179.06 GiB GPU memory, 30.51 GiB to load the NVFP4 27B model, 104.33 GiB of KV cache available after loading, and 445 MiB per r16 adapter. The 26.31 GiB engine overhead is derived from those numbers. The throughput range (prefill 10k, 20k, 40k and decode 1,250, 2,500, 5,000 tokens/s), KV memory by context length (1, 2, 6 GiB), and utilization caps by latency target (0.5, 0.6, 0.8) are example assumptions. For H100 and H200 only the public memory spec is used; NVFP4 is a Blackwell feature, so in practice those GPUs may need a different precision and model size.</p>
    <p>The shared setup assumes every task peaks at the same time. The packed baseline (A′) ignores interference between engines on one GPU, which favors the independent side. A shared engine is a single failure domain for all tasks, and only adapters that pass quality validation should share an engine.</p>
