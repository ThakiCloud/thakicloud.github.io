<!-- Pin the theme before first paint (no flash), honouring the reader's own choice.
     ⛔ 2026-08-19: this used to hard-code 'light' with the comment "no theme toggle" —
     but masthead.html DOES ship a toggle that writes localStorage['theme']. So every
     navigation snapped dark-mode readers back to light and the toggle looked broken.
     The pin must read what the toggle wrote; theme-color is synced for the same reason. -->
<script>
  (function () {
    var t = 'light';
    try { if (localStorage.getItem('theme') === 'dark') t = 'dark'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#0a0a0a' : '#ffffff');
  })();
</script>

{%- if page.collection == 'posts' -%}
<!-- hreflang alternates for this post.
     The sitemaps already carry these, but the page-level links are also what the
     injected site chrome (thaki-chrome.js, from the homepage repo) reads to send
     its EN/KO toggle to the real translation. Without them the toggle can only
     guess by swapping the language segment, which 404s wherever the category
     segment differs between languages. -->
{%- include post-translations.html url=page.url -%}
{%- if tr_ko != '' %}
<link rel="alternate" hreflang="ko" href="{{ site.url }}{{ site.baseurl }}{{ tr_ko }}">
{%- endif -%}
{%- if tr_en != '' %}
<link rel="alternate" hreflang="en" href="{{ site.url }}{{ site.baseurl }}{{ tr_en }}">
{%- endif -%}
{%- if tr_ar != '' %}
<link rel="alternate" hreflang="ar" href="{{ site.url }}{{ site.baseurl }}{{ tr_ar }}">
{%- endif -%}
{%- endif %}
