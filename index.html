<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Thaki Cloud | ThakiCloud 기술 블로그</title>
  <link rel="canonical" href="{{ site.url }}/ko/">
  <meta name="robots" content="noindex, follow">
  <!-- No-JS fallback: send crawlers/older clients to the Korean home. -->
  <meta http-equiv="refresh" content="0; url={{ site.baseurl }}/ko/">
  <script>
    (function () {
      var supported = { ko: 1, en: 1 };
      function cookie(name) {
        var v = "; " + document.cookie;
        var parts = v.split("; " + name + "=");
        if (parts.length === 2) return parts.pop().split(";").shift();
      }
      var lang = (navigator.language || navigator.userLanguage || "ko").toLowerCase();
      var target = "ko";
      if (lang.indexOf("en") === 0) target = "en";
      // A previously chosen language wins over browser detection.
      var saved = cookie("preferred_language");
      if (saved && supported[saved]) target = saved;
      location.replace("{{ site.baseurl }}/" + target + "/");
    })();
  </script>
</head>
<body>
  <noscript>
    <p>Redirecting… choose a language:
      <a href="{{ site.baseurl }}/ko/">한국어</a> ·
      <a href="{{ site.baseurl }}/en/">English</a>
    </p>
  </noscript>
</body>
</html>
